services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_KEY: ${APP_KEY}
            APP_URL: http://127.0.0.1:8000
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-shiftswap}
            DB_USERNAME: ${DB_USERNAME:-shiftswap}
            DB_PASSWORD: ${DB_PASSWORD:-shiftswap_local}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        ports:
            - '127.0.0.1:8000:8000'
        command: >-
            sh -c 'php artisan migrate --force && php artisan serve
            --host=0.0.0.0 --port=8000'

    postgres:
        image: docker.io/library/postgres:16.4-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-shiftswap}
            POSTGRES_USER: ${DB_USERNAME:-shiftswap}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftswap_local}
        ports:
            - '127.0.0.1:${DB_PORT:-5432}:5432'
        volumes:
            - shiftswap_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-shiftswap} -d ${DB_DATABASE:-shiftswap}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    shiftswap_postgres_data:
