services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_KEY: ${APP_KEY:-base64:7n+2wFmR9n7YqM3rE1x0K9v8Z7y6W5x4V3u2T1s0R9q=}
            APP_URL: http://localhost:8000
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-shiftswap}
            DB_USERNAME: ${DB_USERNAME:-shiftswap}
            DB_PASSWORD: ${DB_PASSWORD:-shiftswap_local}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            XDG_CONFIG_HOME: /tmp
        ports:
            - '${BACKEND_PORT:-8000}:8000'
        command: >-
            sh -c 'php artisan migrate --force && php artisan tinker --execute "if (class_exists(\"App\\Models\\User\") && \App\Models\User::count() === 0) { \Artisan::call(\"db:seed\", [\"--force\" => true]); }" && php artisan serve --host=0.0.0.0 --port=8000'

    frontend:
        build:
            context: ../shiftswap-frontend
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            - app
        environment:
            VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        ports:
            - '${FRONTEND_PORT:-5173}:5173'
        volumes:
            - ../shiftswap-frontend:/app
            - /app/node_modules

    postgres:
        image: docker.io/library/postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-shiftswap}
            POSTGRES_USER: ${DB_USERNAME:-shiftswap}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftswap_local}
        ports:
            - '127.0.0.1:${DB_PORT:-5433}:5432'
        volumes:
            - shiftswap_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-shiftswap} -d ${DB_DATABASE:-shiftswap}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    shiftswap_postgres_data:
